<style>
  /* Paleta e tipografia herdadas do site principal. */
  :root{
    --wine:#6d0f30;
    --wine-dark:#4a0a20;
    --rose:#b8455f;
    --champagne:#f9ebef;
    --off:#fcfcfb;
    --ink:#1a1518;
    --muted:#8a8085;
    --line:#eee7e9;
    /* Cor de repouso da borda + ângulo do facho que corre nela.
       Declarado aqui também como fallback: em navegador sem @property
       o ângulo não anima, mas a borda continua desenhada. */
    --edge:rgba(109,15,48,.14);
    --angle:0deg;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:64px 22px 40px;
    background:#fff;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }


  main{position:relative;z-index:1;width:100%;max-width:392px;text-align:center}

  /* ---------- PERFIL ---------- */
  .avatar{
    width:104px;height:104px;
    margin:0 auto 20px;
    display:grid;place-items:center;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 14px 30px -18px rgba(109,15,48,.45);
  }
  .avatar img{width:58px;height:auto}

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:500;
    font-size:27px;
    letter-spacing:.01em;
  }

  .handle{
    margin-top:6px;
    font-size:13.5px;
    color:var(--rose);
  }

  .bio{
    margin:14px auto 0;
    max-width:300px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--muted);
  }

  /* ---------- BOTÕES ---------- */
  /* O ângulo anima uma vez só, no container, e desce por herança para os
     quatro botões. Um keyframe em vez de quatro, e nada de brigar com a
     animação de entrada que cada botão já carrega. */
  @property --angle{
    syntax:"<angle>";
    initial-value:0deg;
    inherits:true;
  }
  @keyframes run-border{to{--angle:360deg}}

  .links{
    display:grid;
    gap:14px;
    margin-top:32px;
    animation:run-border 5s linear infinite;
  }

  /* A borda é o próprio background pintado no border-box; o miolo branco
     cobre o padding-box. Sem pseudo-elemento, sem z-index negativo (era
     isso que sumia atrás do fundo do botão) e sem overflow cortando nada. */
  a.link{
    --phase:0deg;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:58px;
    padding:16px 52px;
    border:1.5px solid transparent;
    border-radius:14px;
    background:
      linear-gradient(#fff,#fff) padding-box,
      conic-gradient(from calc(var(--angle) + var(--phase)),
        var(--edge) 0deg,
        var(--edge) 148deg,
        var(--rose) 176deg,
        var(--wine) 180deg,
        var(--rose) 184deg,
        var(--edge) 212deg,
        var(--edge) 360deg) border-box;
    color:var(--wine);
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
    text-decoration:none;
    box-shadow:0 4px 16px -8px rgba(109,15,48,.16);
    transition:transform .28s ease,box-shadow .28s ease;
  }
  /* Defasagem para os fachos não passarem todos na mesma altura. */
  a.link:nth-of-type(2){--phase:90deg}
  a.link:nth-of-type(3){--phase:180deg}
  a.link:nth-of-type(4){--phase:270deg}

  a.link svg{
    position:absolute;left:20px;top:50%;margin-top:-10px;
    width:20px;height:20px;fill:currentColor;
    transition:fill .28s ease;
  }
  a.link:hover,
  a.link:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 12px 28px -10px rgba(109,15,48,.2),0 0 12px rgba(184,69,95,.08);
    outline:none;
  }
  a.link:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
  a.link:active{transform:translateY(0)}


  /* ---------- RODAPÉ ---------- */
  .foot-logo{width:104px;height:auto;margin:44px auto 0;display:block;opacity:.55}
  footer{margin-top:12px;font-size:11.5px;color:var(--muted)}

  /* Entrada curta, uma vez só. */
  .reveal{opacity:0;transform:translateY(10px);animation:rise .6s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.04s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}
  .d4{animation-delay:.22s}.d5{animation-delay:.28s}.d6{animation-delay:.34s}.d7{animation-delay:.4s}.d8{animation-delay:.46s}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
    .reveal{opacity:1;transform:none}
    /* Sem movimento o facho ficaria estacionado num canto: vira borda lisa. */
    a.link{
      background:
        linear-gradient(#fff,#fff) padding-box,
        linear-gradient(rgba(109,15,48,.25),rgba(109,15,48,.25)) border-box;
    }
  }
</style>
</head>
